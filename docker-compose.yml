services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops_secret
      POSTGRES_DB: pulseops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
    name: pulseops_pgdata
